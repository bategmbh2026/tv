<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bate TV Flyer</title>
<style>
/* VOICE: shop signage, calm and loud at once
   IDEA: a lit shop-window poster frame
   PICTURE: the flyer itself, full height, on a glow of its own colours
   COLOUR and TYPE: black ground, gold #e9c46a accent, Inter
   LAYOUT: one flyer centred per TV, four TVs change together every 15 s */
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;cursor:none;font-family:Inter,system-ui,sans-serif;color:#fff}
.layer{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;opacity:0;transition:opacity 1s ease;background-color:#111;background-position:center center;background-repeat:no-repeat;background-size:contain}
.layer.on{opacity:1}
#pick{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:5vh;background:#111;cursor:default}
#pick h1{font-size:5vh;font-weight:700}
#pick p{font-size:2.4vh;opacity:.7;text-align:center;max-width:70vw}
#pick .row{display:flex;gap:3vw}
#pick button{font:700 6vh Inter,system-ui,sans-serif;width:16vw;height:22vh;border-radius:2vh;border:.5vh solid #333;background:#1c1c1c;color:#fff}
#pick button:focus{outline:none;border-color:#e9c46a;background:#2a2410;color:#e9c46a;transform:scale(1.06)}
#tag{position:absolute;right:1.5vw;bottom:1.2vh;font-size:1.6vh;opacity:0;transition:opacity .4s}
#tag.on{opacity:.6}
</style></head><body>
<div id="A" class="layer"></div>
<div id="B" class="layer"></div>
<div id="pick"><h1>Welcher Bildschirm ist das?</h1>
<div class="row"><button data-tv="1">TV 1</button><button data-tv="2">TV 2</button><button data-tv="3">TV 3</button><button data-tv="4">TV 4</button></div>
<p>Von links nach rechts zählen. Auswahl mit Pfeiltasten und OK. Später ändern: Taste 0 auf der Fernbedienung.</p></div>
<div id="tag"></div>
<script>
{
const FIX='f1.jpg', FL=[1,2,3,4,5,6,7,8].map(n=>'p'+n+'.jpg'), SEC=15, SCREENS=3, N=FL.length;
const pick=document.getElementById('pick'), tag=document.getElementById('tag');
const L=[document.getElementById('A'),document.getElementById('B')];
let tv=0, cur=-99, front=0, timer=null;
const pre=FL.map(s=>{const i=new Image();i.src=s;return i});
const save=v=>{try{localStorage.setItem('bateTV',v)}catch(e){}};
const load=()=>{try{return +localStorage.getItem('bateTV')||0}catch(e){return 0}};
const idx=slot=>((slot*SCREENS+tv-2)%N+N)%N;
function show(i){
  if(i===cur)return; cur=i;
  const nx=L[1-front], im=new Image(), src=i<0?FIX:FL[i];
  const go=()=>{nx.style.backgroundImage='url('+src+')';nx.style.backgroundColor=(i<0?'#690f19':'#111');nx.classList.add('on');L[front].classList.remove('on');front=1-front};
  im.onload=go; im.onerror=go; im.src=src;
}
function tick(){
  const now=Date.now(), slot=Math.floor(now/1000/SEC);
  show(tv===1?-1:idx(slot));
  clearTimeout(timer); timer=setTimeout(tick, SEC*1000-(now%(SEC*1000))+30);
}
function start(n){
  tv=n; save(n); pick.style.display='none';
  if(location.hash!=='#tv'+n) history.replaceState(null,'','#tv'+n);
  tag.textContent='TV '+n; tag.classList.add('on'); setTimeout(()=>tag.classList.remove('on'),3000);
  cur=-99; tick();
}
function choose(){
  clearTimeout(timer); L.forEach(l=>l.classList.remove('on'));
  pick.style.display='flex';
  const b=pick.querySelector('[data-tv="'+(tv||1)+'"]'); b&&b.focus();
}
function fromHash(){const m=/^#tv([1-4])$/.exec(location.hash);return m?+m[1]:0}
pick.addEventListener('click',e=>{const b=e.target.closest('button');b&&start(+b.dataset.tv)});
document.addEventListener('keydown',e=>{
  if(pick.style.display==='flex'){
    const bs=[...pick.querySelectorAll('button')], k=bs.indexOf(document.activeElement);
    if(e.key==='ArrowRight'){bs[Math.min(3,k+1)].focus();e.preventDefault()}
    if(e.key==='ArrowLeft'){bs[Math.max(0,k-1)].focus();e.preventDefault()}
    if(/^[1-4]$/.test(e.key))start(+e.key);
  }else{
    if(e.key==='0'||e.key==='Escape'&&false)choose();
    if(/^[1-4]$/.test(e.key))start(+e.key);
  }
});
window.addEventListener('hashchange',()=>{const h=fromHash();if(h&&h!==tv)start(h)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tv)tick()});
const first=fromHash()||load();
first?start(first):choose();
}
</script></body></html>
